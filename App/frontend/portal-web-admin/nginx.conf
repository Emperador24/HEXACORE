map $sent_http_content_type $cache_html {
  default "";
  ~*^text/html "no-store";
}

server {
  listen 4201;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/hexacore/origenes-csp.conf;
  sub_filter '__HEXACORE_CSP_NONCE__' '$request_id';
  sub_filter_once off;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'nonce-$request_id'; script-src-attr 'none'; style-src 'self' 'nonce-$request_id' https://fonts.googleapis.com/css2 https://fonts.googleapis.com/icon; style-src-attr 'none'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' $csp_api $csp_buzon; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'; worker-src 'none'; media-src 'none'" always;
  add_header Cache-Control $cache_html always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  location = /index.html {
    etag off;
    if_modified_since off;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
