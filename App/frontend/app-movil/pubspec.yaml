name: hexacore_app
description: Aplicación móvil HEXACORE para clientes y personal operativo.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  # Llamadas al Servicio de Entradas y Mercado Secundario (CU-006).
  http: ^1.2.2
  flutter_native_splash: ^2.4.3
  shared_preferences: ^2.3.3
  # 7.x y no 6.x: la 6 usa Google ML Kit, que no trae versión para el
  # simulador de iPhone ("Unsupported Swift architecture"). El uso del escáner
  # es el mismo en las dos ramas.
  mobile_scanner: ^7.4.2
  # Llavero del dispositivo (Keychain / Keystore) para los tokens de sesión (CU-027).
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  # Pruebas de extremo a extremo en un simulador contra el backend real.
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0B0F1A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter_native_splash:
  color: "#0B0F1A"
  image: assets/icon/icon_foreground.png
  android_12:
    image: assets/icon/icon_foreground.png
    icon_background_color: "#0B0F1A"
