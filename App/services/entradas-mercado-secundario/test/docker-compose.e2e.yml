name: entradas-e2e
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hexacore
      POSTGRES_PASSWORD: hexacore
      POSTGRES_DB: entradas_e2e
    ports: ["127.0.0.1:15434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexacore -d entradas_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:16381:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: hexacore
      RABBITMQ_DEFAULT_PASS: hexacore
    ports: ["127.0.0.1:15674:5672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 3s
      timeout: 10s
      retries: 30
  pasarela:
    build: ../../../infra/pasarela-pagos-simulada
    ports: ["127.0.0.1:13100:3099"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3099/salud',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
