# Configuración principal de Nginx para el API Gateway.
#
# Es la de la imagen oficial con una sola diferencia: carga el módulo njs, que
# es el que valida el JWT dentro del gateway (ADR-15). `load_module` solo se
# admite aquí, fuera de `http {}`, y por eso no basta con `conf.d/`.
load_module modules/ngx_http_js_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
