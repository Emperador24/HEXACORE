# API Gateway + balanceador (ADR-02, ADR-15).
#
# Es el punto único de entrada al backend: centraliza autenticación,
# autorización y enrutamiento, como dice la vista de contenedores del SAD §8 y
# el ADR-02.
#
# ## Cómo autentica: el JWT se valida aquí, con la clave pública
#
# Antes de enrutar una ruta protegida, Nginx hace una subpetición
# (`auth_request`) a `/_auth`, que resuelve `autenticacion.js` sin salir del
# gateway: firma RS256, emisor, caducidad y rol. **No llama a Autenticación en
# cada petición** (ADR-15): hasta entonces le preguntaba a
# `GET /api/v1/sesiones/verificar`, y eso ponía al servicio que emite los
# tokens en el camino de todo el tráfico.
#
# En la ruta de compra, además, exige el turno de la Cola virtual y lo gasta
# antes de dejar pasar a Ventas.
#
# **Los servicios siguen verificando por su cuenta** (RNF-06), y son ellos los
# que comprueban en Redis que la sesión no esté cerrada: si alguien los
# alcanzara sin pasar por aquí, no entraría igual.

js_import autenticacion from /etc/nginx/njs/autenticacion.js;

# Los nombres de los servicios los resuelve el DNS interno de Docker. Se
# resuelven **en cada petición** (`resolver` + variable en `proxy_pass`) y no
# solo al arrancar: así, al añadir réplicas con `--scale`, el gateway las
# reparte sin reiniciarlo, y al quitar una deja de usarla (RNF-03, RNF-10).
resolver 127.0.0.11 valid=5s ipv6=off;

# --- CORS, aquí y no en cada servicio -------------------------------------
# Los microservicios no hablan con navegadores: hablan con el gateway. Que cada
# uno mantuviera su propia lista de orígenes sería repetir la misma regla en
# seis sitios, con seis formas de equivocarse.
#
# Con cookies de por medio no vale responder `*`: hay que devolver el origen
# exacto. En desarrollo se aceptan los portales (4200 y 4201) servidos desde
# cualquier máquina de la red, para poder abrirlos desde otro computador. En
# producción esto se reduce a los dominios reales.
map $http_origin $origen_permitido {
    default "";
    "~^http://([a-zA-Z0-9.\-]+):(4200|4201)$" $http_origin;
}


server {
    listen 8080;
    server_name _;

    # El gateway no impone su propio límite de tamaño: los servicios validan.
    client_max_body_size 2m;
    # Un servicio lento no debe colgar al gateway.
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;

    # Un destino por servicio (ADR-14). Las rutas públicas no cambiaron al
    # partir el sistema: el frontend y las pruebas siguen llamando igual, lo
    # que cambió es a qué contenedor llega cada una.
    set $autenticacion "autenticacion:3002";
    set $entradas "ventas:3001";
    set $catalogo "catalogo:3004";
    set $alimentos "alimentos:3007";
    set $cola "cola-virtual:3009";
    set $accesoqr "acceso-qr:3010";
    set $postventa "postventa:3011";
    set $logistica "eventos-emergencias:3016";
    set $pagos "pagos:3008";

    # Lo que cada ruta exige además de un token válido lo declara la propia
    # ruta con `set $roles_requeridos` y `set $turno_requerido`, y lo lee
    # `autenticacion.js`. **No se les da valor por defecto aquí**: la
    # subpetición `/_auth` vuelve a pasar por la fase de reescritura del
    # servidor, y un `set` a este nivel borraría lo que declaró la ruta.

    # Gastar el turno es una llamada del gateway a la Cola virtual: si no
    # responde, se falla pronto en vez de dejar al comprador esperando.
    js_fetch_timeout 5s;
    resolver_timeout 3s;

    # Qué instancia respondió: es lo que permite ver el balanceo en vivo.
    add_header X-Servidor $upstream_addr always;

    # Permisos de CORS en todas las respuestas del gateway.
    add_header Access-Control-Allow-Origin $origen_permitido always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Vary Origin always;

    # La comprobación previa del navegador (`OPTIONS`) se responde aquí mismo:
    # no lleva token —no puede llevarlo— y no necesita llegar a ningún
    # servicio. Se desvía a un bloque propio porque Nginx no admite cabeceras
    # dentro de un `if` a este nivel.
    if ($request_method = OPTIONS) {
        return 418;
    }
    error_page 418 = @comprobacion_previa;

    # Identifica la petición de extremo a extremo (trazabilidad, RNF-11).
    proxy_set_header X-Peticion-Id $request_id;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # --- Sonda del propio gateway -------------------------------------------
    location = /salud {
        default_type application/json;
        return 200 '{"servicio":"api-gateway","estado":"arriba"}';
    }

    # --- Subpetición de autenticación (interna) ------------------------------
    # La resuelve `autenticacion.js` en el propio gateway. Responde 204 con la
    # identidad, o 401/403 con el motivo en `X-Motivo`.
    location = /_auth {
        internal;
        js_content autenticacion.verificar;
    }

    # --- Rutas públicas del CU-027 -------------------------------------------
    # Registro, verificación, login, renovación y recuperación no pueden exigir
    # token: sirven precisamente para obtenerlo o recuperar el acceso.
    #
    # Van una por una con coincidencia exacta (`location =`), que en Nginx tiene
    # prioridad sobre cualquier prefijo. Con una expresión regular, `/api/v1/
    # sesiones` chocaba con el prefijo `/api/v1/sesiones/` y Nginx respondía un
    # 301 en vez de enrutar. Además, nombrarlas una a una evita que un patrón
    # deje abierta de más alguna ruta.
    location = /api/v1/salud                { proxy_pass http://$autenticacion$request_uri; }
    location = /api/v1/sesiones             { proxy_pass http://$autenticacion$request_uri; }
    location = /api/v1/sesiones/renovar     { proxy_pass http://$autenticacion$request_uri; }
    location = /api/v1/cuentas/registro     { proxy_pass http://$autenticacion$request_uri; }
    location = /api/v1/cuentas/verificar    { proxy_pass http://$autenticacion$request_uri; }
    location = /api/v1/cuentas/recuperacion { proxy_pass http://$autenticacion$request_uri; }
    location = /api/v1/cuentas/restablecer  { proxy_pass http://$autenticacion$request_uri; }

    # --- Resto del Servicio de Administración (exige sesión) -----------------
    location /api/v1/cuentas/ {
        include /etc/nginx/hexacore/autenticar.conf;
        proxy_pass http://$autenticacion$request_uri;
    }

    location /api/v1/admin/ {
        set $roles_requeridos "Administrador";
        include /etc/nginx/hexacore/autenticar.conf;
        proxy_pass http://$autenticacion$request_uri;
    }

    location /api/v1/sesiones/ {
        include /etc/nginx/hexacore/autenticar.conf;
        proxy_pass http://$autenticacion$request_uri;
    }

    # --- Cartelera pública (CU-005) ------------------------------------------
    # Sin `auth_request`: la cartelera se ve sin iniciar sesión (es la única
    # excepción a RNF-06; ver ventas/DECISIONES.md §12).
    # A cambio, solo se deja pasar lectura: `limit_except` rechaza con 403
    # cualquier método que no sea GET (o HEAD, que Nginx incluye con GET).
    # Tampoco se reenvían X-Usuario-Id ni X-Usuario-Roles: aquí no hay usuario.
    #
    # Desde la fase A de ADR-14 la sirve su propio microservicio: por eso va a
    # $catalogo y no a $entradas. Es el cambio que permite escalar la consulta
    # sin escalar la compra.
    location = /api/v1/cartelera {
        limit_except GET { deny all; }
        proxy_pass http://$catalogo$request_uri;
    }
    location /api/v1/cartelera/ {
        limit_except GET { deny all; }
        proxy_pass http://$catalogo$request_uri;
    }

    # --- Venta primaria (CU-001 a CU-004): exige sesión -----------------------
    # `= /api/v1/compras` y `/api/v1/compras/` por separado: la primera es la
    # colección (reservar y listar), la segunda todo lo que cuelga de una compra.
    #
    # Reservar pide además el turno de la Cola virtual en `X-Turno-Cola`. El
    # gateway lo gasta antes de reenviar (ADR-15): así Ventas solo recibe a
    # cuantos puede atender, y no necesita llamar a la Cola para saberlo.
    location = /api/v1/compras {
        set $roles_requeridos "Cliente";
        # Reservar exige turno de la Cola virtual (ADR-15); listar las compras
        # propias, no. `if` con solo un `set` dentro es de los usos seguros.
        if ($request_method = POST) {
            set $turno_requerido "1";
        }
        include /etc/nginx/hexacore/autenticar.conf;
        proxy_pass http://$entradas$request_uri;
    }
    location /api/v1/compras/ {
        set $roles_requeridos "Cliente";
        include /etc/nginx/hexacore/autenticar.conf;
        proxy_pass http://$entradas$request_uri;
    }
    # Validación de QR en la puerta (CU-002), para el personal de ingreso.
    # Desde la fase A de ADR-14 lo sirve su propio microservicio: su pico es en
    # la puerta del evento, en otro momento que el de la venta.
    location = /api/v1/ingresos {
        set $roles_requeridos "Personal,Administrador";
        include /etc/nginx/hexacore/autenticar.conf;
        proxy_pass http://$accesoqr$request_uri;
    }
    location /api/v1/ingresos/ {
        set $roles_requeridos "Personal,Administrador";
        include /etc/nginx/hexacore/autenticar.conf;
        proxy_pass http://$accesoqr$request_uri;
    }

    # --- Postventa: el mercado secundario (CU-006) ---------------------------
    # Ya no va a Ventas: desde ADR-14 el CU-006 es su propio servicio. La ruta
    # pública no cambió, así que el frontend y las pruebas siguen llamando
    # igual — lo que cambió es a qué contenedor llega.
    #
    # `/interno/` de Ventas NO se enruta: retener, transferir y liberar
    # entradas lo pide Postventa por la red interna, no un cliente.
    location /api/v1/reventa/ {
        set $roles_requeridos "Cliente,Administrador";
        include /etc/nginx/hexacore/autenticar.conf;
        proxy_pass http://$postventa$request_uri;
    }

    # --- Cola virtual: el turno para entrar a comprar -------------------------
    # Exige sesión como todo lo demás: si fuera anónima, cualquiera podría
    # llenar la fila con solicitudes inventadas y dejar fuera a los compradores
    # reales.
    #
    # `/interno/` NO se enruta: gastar el turno lo hace el propio gateway, en
    # `autenticacion.js`, no el cliente.
    location /api/v1/cola/ {
        include /etc/nginx/hexacore/autenticar.conf;
        proxy_pass http://$cola$request_uri;
    }

    # --- Alimentos (CU-011 a CU-015) -----------------------------------------
    # Desde la fase A de ADR-14 lo sirve su propio servicio de dominio: por eso
    # va a $alimentos y no a $autenticacion.
    location /api/v1/pedidos/ {
        include /etc/nginx/hexacore/autenticar.conf;
        proxy_pass http://$alimentos$request_uri;
    }

    # Logística: turnos y asistencia del personal (CU-017, CU-018). El servicio
    # ya sirve sus rutas bajo `/api/v1/logistica/...`, así que se reenvía la URI
    # tal cual, sin reescribir.
    location /api/v1/logistica/ {
        include /etc/nginx/hexacore/autenticar.conf;
        proxy_pass http://$logistica$request_uri;
    }

    # --- Webhook de la Pasarela de Pagos (ADR-15) -----------------------------
    # La única ruta pública que no es de un usuario: la llama la pasarela para
    # confirmar un cobro o un reembolso. No lleva JWT —la pasarela no tiene
    # sesión—; la autentica Pagos con la firma HMAC del cuerpo, que es lo que
    # hacen las pasarelas reales. Solo se acepta POST, y nada más de Pagos se
    # expone: cobrar y reembolsar siguen siendo llamadas internas.
    location = /api/v1/pagos/webhook {
        limit_except POST { deny all; }
        proxy_pass http://$pagos$request_uri;
    }

    location @comprobacion_previa {
        add_header Access-Control-Allow-Origin $origen_permitido always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Hexacore-Cliente, Idempotency-Key, X-Turno-Cola" always;
        add_header Access-Control-Max-Age 600 always;
        add_header Content-Length 0 always;
        return 204;
    }

    # --- Errores del gateway, en el mismo formato que los servicios ----------
    error_page 401 = @no_autenticado;
    location @no_autenticado {
        default_type application/json;
        return 401 '{"codigo":"SIN_AUTENTICAR","mensaje":"Necesitas iniciar sesión para hacer esto"}';
    }
    # Un 403 de la subpetición dice en `X-Motivo` por qué. Cada motivo tiene su
    # respuesta, porque el cliente hace cosas distintas con cada uno: sin turno
    # tiene que ir a la fila; con un rol que no alcanza, no hay nada que hacer.
    error_page 403 = @denegado;
    location @denegado {
        default_type application/json;
        if ($motivo_rechazo = TURNO_REQUERIDO) {
            return 428 '{"codigo":"TURNO_REQUERIDO","mensaje":"Para comprar necesitas un turno de la fila virtual. Pídelo y vuelve a intentarlo."}';
        }
        if ($motivo_rechazo = TURNO_INVALIDO) {
            return 403 '{"codigo":"TURNO_INVALIDO","mensaje":"Tu turno ya se usó o caducó. Pide uno nuevo en la fila virtual."}';
        }
        if ($motivo_rechazo = COLA_NO_DISPONIBLE) {
            return 503 '{"codigo":"COLA_NO_DISPONIBLE","mensaje":"La fila virtual no responde. Inténtalo de nuevo en unos segundos."}';
        }
        if ($motivo_rechazo = ROL_INSUFICIENTE) {
            return 403 '{"codigo":"ROL_INSUFICIENTE","mensaje":"Tu cuenta no tiene permiso para hacer esto"}';
        }
        # Sin motivo: un `deny` de Nginx, como un método no permitido.
        return 403 '{"codigo":"PROHIBIDO","mensaje":"Esa operación no está permitida"}';
    }

    error_page 502 503 504 = @sin_servicio;
    location @sin_servicio {
        default_type application/json;
        return 503 '{"codigo":"SERVICIO_NO_DISPONIBLE","mensaje":"El servicio no está disponible en este momento. Inténtalo de nuevo en unos segundos."}';
    }

    location / {
        default_type application/json;
        return 404 '{"codigo":"RUTA_NO_ENCONTRADA","mensaje":"Esa ruta no existe en el API Gateway"}';
    }
}
