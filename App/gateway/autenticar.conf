# Lo que hace cada ruta protegida antes de enrutar. Se incluye en cada
# `location` en vez de copiarse: eran cinco líneas idénticas en once sitios.
#
# `autenticacion.js` responde la subpetición sin salir del gateway. Sus
# cabeceras se leen con `$sent_http_*` y no con `$upstream_http_*`, porque ya
# no hay un servicio detrás que las mande: las escribe el propio Nginx.
auth_request /_auth;
auth_request_set $usuario $sent_http_x_usuario_id;
auth_request_set $roles $sent_http_x_usuario_roles;
auth_request_set $motivo_rechazo $sent_http_x_motivo;
auth_request_set $turno_evento $sent_http_x_turno_evento;
proxy_set_header X-Usuario-Id $usuario;
proxy_set_header X-Usuario-Roles $roles;
proxy_set_header X-Turno-Evento $turno_evento;
