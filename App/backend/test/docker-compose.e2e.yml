name: hexacore-base-unica-e2e
services:
  correo:
    image: node:22.22.3-alpine
    user: node
    command: ["node", "/app/proveedor.cjs"]
    volumes: ["./trabajador/proveedor.cjs:/app/proveedor.cjs:ro"]
    ports: ["127.0.0.1:13106:3098"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3098/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cu011_e2e
      POSTGRES_PASSWORD: cu011_e2e
      POSTGRES_DB: ${POSTGRES_BD_PRUEBAS:-hexacore_e2e}
    ports: ["127.0.0.1:15439:5432"]
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cu011_e2e -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:16384:6379"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  rabbitmq:
    hostname: ${RABBITMQ_NODO_PRUEBAS:-base-unica-e2e}
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: cu011_e2e
      RABBITMQ_DEFAULT_PASS: cu011_e2e
      RABBITMQ_DEFAULT_VHOST: cu011
    ports: ["127.0.0.1:15679:5672", "127.0.0.1:16779:15672"]
    volumes: ["rabbitmq:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 3s
      timeout: 10s
      retries: 30
  pasarela:
    image: node:22.22.3-alpine
    user: node
    working_dir: /app
    command: ["node", "server.js"]
    volumes:
      - ../../infra/pasarela-pagos-simulada/server.js:/app/server.js:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      # El override de imágenes usa el DNS nucleo:3002 en la misma red.
      WEBHOOK_URL: http://host.docker.internal:13087/api/v1/pagos/webhook
      SECRETO_WEBHOOK: backend-webhook-pruebas
    ports: ["127.0.0.1:13105:3099"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3099/salud',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
  preparacion-base:
    build: ..
    command: ["node", "dist/compartido/persistencia/preparar-base.js"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: test
      PROGRAMA_BACKEND: migracion
      POSTGRES_HOST: postgres
      POSTGRES_PUERTO: "5432"
      POSTGRES_USUARIO: cu011_e2e
      POSTGRES_CONTRASENA: cu011_e2e
      POSTGRES_BD: ${POSTGRES_BD_PRUEBAS:-hexacore_e2e}
    healthcheck: { disable: true }
    restart: "no"
volumes:
  postgres:
  redis:
  rabbitmq:
