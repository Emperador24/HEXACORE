services:
  boleteria:
    build:
      context: ../..
      dockerfile: Dockerfile.boleteria
    init: true
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      pagos: { condition: service_healthy }
    environment:
      NODE_ENV: test
      PUERTO: "3001"
      POSTGRES_HOST: postgres
      POSTGRES_PUERTO: "5432"
      POSTGRES_USUARIO: boleteria_e2e
      POSTGRES_CONTRASENA: boleteria_e2e
      POSTGRES_BD_VENTAS: entradas_e2e
      POSTGRES_BD_CATALOGO: catalogo_boleteria_e2e
      POSTGRES_BD_POSTVENTA: postventa_boleteria_e2e
      POSTGRES_BD_ACCESO_QR: acceso_qr_boleteria_e2e
      REDIS_HOST: redis
      REDIS_PUERTO: "6379"
      RABBITMQ_URL: amqp://boleteria_e2e:boleteria_e2e@rabbitmq:5672/boleteria
      PAGOS_URL: http://pagos:3008/api/v1
      VENTAS_URL: http://127.0.0.1:9/servidor-retirado
      AUTH_JWT_CLAVE_PUBLICA_ARCHIVO: /claves/jwt-publica.pem
      TOKEN_SERVICIOS: boleteria-e2e-servicios
    ports: ["127.0.0.1:13097:3001"]
    volumes:
      - ../claves/jwt-publica.pem:/claves/jwt-publica.pem:ro
  gateway:
    build: ../../../gateway
    depends_on:
      boleteria: { condition: service_healthy }
    ports: ["127.0.0.1:18081:8080"]
    volumes:
      - ../claves/jwt-publica.pem:/etc/nginx/claves/jwt-publica.pem:ro
