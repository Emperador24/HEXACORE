# Se combina únicamente con docker-compose.e2e.yml, en su proyecto exclusivo.
services:
  nucleo:
    build: ..
    init: true
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      migracion-pagos: { condition: service_completed_successfully }
      pasarela: { condition: service_healthy }
    environment:
      NODE_ENV: test
      PUERTO: "3002"
      POSTGRES_HOST: postgres
      POSTGRES_PUERTO: "5432"
      POSTGRES_USUARIO: cu011_e2e
      POSTGRES_CONTRASENA: cu011_e2e
      POSTGRES_BD_ADMINISTRACION: identidad_cu011_e2e
      POSTGRES_BD_PEDIDOS: alimentos_cu011_e2e
      POSTGRES_MAX_CONEXIONES: "4"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: cu011_e2e
      DB_PASSWORD: cu011_e2e
      DB_NAME: eventos_emergencias_nucleo_e2e
      PREFIJO_COLAS: nucleo-e2e.
      REDIS_HOST: redis
      REDIS_PUERTO: "6379"
      RABBITMQ_URL: amqp://cu011_e2e:cu011_e2e@rabbitmq:5672/cu011
      POSTGRES_BD_PAGOS: pagos_e2e
      PAGOS_PROVEEDOR_URL: http://pasarela:3099
      PASARELA_TIMEOUT_MS: "3000"
      PASARELA_SECRETO_WEBHOOK: backend-webhook-pruebas
      AUTH_JWT_CLAVE_PUBLICA_ARCHIVO: /claves/jwt-publica.pem
      AUTH_JWT_CLAVE_PRIVADA_ARCHIVO: /claves/jwt-privada.pem
    ports: ["127.0.0.1:13089:3002"]
    volumes:
      - ./claves/jwt-publica.pem:/claves/jwt-publica.pem:ro
      - ./claves/jwt-privada.pem:/claves/jwt-privada.pem:ro
  boleteria:
    build:
      context: ..
      dockerfile: Dockerfile.boleteria
    init: true
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      migracion-pagos: { condition: service_completed_successfully }
      pasarela: { condition: service_healthy }
    environment:
      NODE_ENV: test
      PUERTO: "3001"
      POSTGRES_HOST: postgres
      POSTGRES_PUERTO: "5432"
      POSTGRES_USUARIO: cu011_e2e
      POSTGRES_CONTRASENA: cu011_e2e
      POSTGRES_BD_VENTAS: entradas_e2e
      POSTGRES_BD_CATALOGO: catalogo_boleteria_e2e
      POSTGRES_BD_POSTVENTA: postventa_boleteria_e2e
      POSTGRES_BD_ACCESO_QR: acceso_qr_boleteria_e2e
      REDIS_HOST: redis
      REDIS_PUERTO: "6379"
      RABBITMQ_URL: amqp://cu011_e2e:cu011_e2e@rabbitmq:5672/cu011
      POSTGRES_BD_PAGOS: pagos_e2e
      PAGOS_PROVEEDOR_URL: http://pasarela:3099
      PASARELA_TIMEOUT_MS: "3000"
      VENTAS_URL: http://127.0.0.1:9/servidor-retirado
      AUTH_JWT_CLAVE_PUBLICA_ARCHIVO: /claves/jwt-publica.pem
      TOKEN_SERVICIOS: boleteria-e2e-servicios
    ports: ["127.0.0.1:13097:3001"]
    volumes:
      - ./claves/jwt-publica.pem:/claves/jwt-publica.pem:ro
  gateway:
    build: ../../gateway
    depends_on:
      nucleo: { condition: service_healthy }
      boleteria: { condition: service_healthy }
    ports: ["127.0.0.1:18080:8080"]
    volumes:
      - ./claves/jwt-publica.pem:/etc/nginx/claves/jwt-publica.pem:ro
  pasarela:
    environment:
      WEBHOOK_URL: http://nucleo:3002/api/v1/pagos/webhook
