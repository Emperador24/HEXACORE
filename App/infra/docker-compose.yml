# Infraestructura de soporte para el ambiente de desarrollo local (SAD §11).
#
# Una sola instancia de cada pieza compartida entre microservicios, tal como
# describe la vista física para desarrollo/pruebas: "una réplica por
# microservicio, sin balanceo horizontal ni CDN, con Redis/cola/BD en un único
# nodo compartido" — a diferencia de producción, que usa un clúster de
# Kubernetes.
#
# Para desarrollar, los microservicios corren fuera de Docker (npm run
# start:dev) y se conectan a estos puertos; así el ciclo de edición-recarga
# sigue siendo inmediato.
#
# También pueden correr en contenedor, con reinicio automático (RNF-04), con el
# perfil `servicios`. Usan los mismos puertos, así que antes hay que parar los
# que estén corriendo con npm:
#
#   docker compose -f App/infra/docker-compose.yml --profile servicios up -d --build
#
#   docker compose -f App/infra/docker-compose.yml up -d
#   docker compose -f App/infra/docker-compose.yml down          # conserva datos
#   docker compose -f App/infra/docker-compose.yml down -v       # borra datos

name: hexacore-infra

services:
  # PostgreSQL — motor transaccional de todos los dominios (ADR-06).
  # Una base de datos por microservicio (ADR-01): las crea initdb/01-bases.sql,
  # que solo se ejecuta la primera vez que se levanta el volumen.
  postgres:
    image: postgres:16-alpine
    container_name: hexacore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hexacore
      POSTGRES_PASSWORD: hexacore
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-datos:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexacore"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis — bloqueo distribuido temporal del checkout de reventa (ADR-03,
  # ASR-01) y caché de datos de acceso rápido.
  #
  # appendonly sí: el lock es efímero por diseño (tiene TTL), pero perder el
  # AOF en un reinicio liberaría locks vivos y abriría la ventana de doble
  # venta que RNF-01 prohíbe.
  #
  # Puerto 6380 en el host y no el 6379 de siempre: es muy común tener un Redis
  # instalado con Homebrew escuchando ya en 6379 (nos pasó al levantar esto), y
  # en ese caso `up` falla con "address already in use". Con 6380 el compose
  # arranca igual haya o no un Redis local, y no hay riesgo de que el servicio
  # acabe hablando por error con el Redis equivocado.
  redis:
    image: redis:7-alpine
    container_name: hexacore-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis-datos:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # RabbitMQ — cola de tareas para operaciones asíncronas (ADR-10, medido en
  # PoC-05): notificaciones, liquidación de pagos y auditoría.
  # Consola de administración en http://localhost:15672 (hexacore / hexacore).
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: hexacore-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: hexacore
      RABBITMQ_DEFAULT_PASS: hexacore
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-datos:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Pasarela de Pagos simulada — sistema externo del CU-006.
  #
  # Va en un contenedor y no como doble de prueba dentro del servicio de
  # Entradas para que la llamada sea HTTP real: es la única forma de ejercitar
  # el camino CU-006I ("falla la comunicación con la pasarela"), que con un
  # doble en memoria no ocurriría nunca.
  pasarela:
    build: ./pasarela-pagos-simulada
    container_name: hexacore-pasarela
    restart: unless-stopped
    # Confirma cada operación por webhook a la ruta pública del gateway, como
    # una pasarela real (ADR-15). Si el gateway no está levantado, reintenta
    # unas veces y desiste: la pasarela no depende de él para cobrar.
    environment:
      WEBHOOK_URL: http://api-gateway:8080/api/v1/pagos/webhook
      SECRETO_WEBHOOK: secreto-webhook-desarrollo
    ports:
      - "3099:3099"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3099/salud',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Proveedor de Notificaciones simulado — solo correo.
  #
  # Igual que la pasarela: en contenedor y no como doble dentro del servicio,
  # porque el camino CU-027E ("el correo no puede enviarse por falla del
  # proveedor") solo ocurre de verdad si hay una llamada de red que falle.
  # Además permite leer los correos enviados desde una prueba y sacar de ahí el
  # enlace de verificación, como haría una persona abriendo su buzón.
  correo:
    build: ./correo-simulado
    container_name: hexacore-correo
    restart: unless-stopped
    ports:
      - "3098:3098"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3098/salud',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Microservicios (perfil `servicios`) -----------------------------------
  #
  # `restart: unless-stopped` es lo que cubre RNF-04 en este ambiente: si el
  # proceso muere, Docker lo levanta de nuevo sin intervención. Lo que Docker
  # Compose NO hace es reiniciar un contenedor que sigue vivo pero `unhealthy`
  # (colgado); eso es trabajo de la sonda de vida de Kubernetes en producción
  # (SAD §11). Ver backend/modulos/identidad/DECISIONES.md §18.
  #
  # NODE_ENV=development porque usan las claves JWT de desarrollo, que en
  # producción se rechazan a propósito.

  # API Gateway + balanceador (ADR-02): el punto único de entrada al backend.
  # Valida el JWT con la clave pública sin llamar a Autenticación, autoriza por
  # rol, exige el turno de la Cola virtual al comprar (ADR-15), y reparte entre
  # las réplicas de cada servicio.
  api-gateway:
    profiles: ["servicios"]
    build: ../gateway
    container_name: hexacore-gateway
    restart: unless-stopped
    depends_on:
      nucleo: { condition: service_healthy }
      boleteria: { condition: service_healthy }
    volumes:
      - ../gateway/nginx-principal.conf:/etc/nginx/nginx.conf:ro
      - ../gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../gateway/autenticar.conf:/etc/nginx/hexacore/autenticar.conf:ro
      - ../gateway/autenticacion.js:/etc/nginx/njs/autenticacion.js:ro
      - ./claves-desarrollo/jwt-publica.pem:/etc/nginx/claves/jwt-publica.pem:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/salud || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Núcleo — servicio de dominio que agrupa Administración y Pedidos (ADR-12).
  # Ahora reúne Identidad, Alimentos y Personal/Logística, cada uno contra
  # su propia base. Sin `container_name`: es lo que permitirá replicarlo
  # (`--scale nucleo=2`) cuando el temporizador de reservas esté protegido con
  # un candado en Redis.
  nucleo:
    profiles: ["servicios"]
    build: ../backend
    restart: unless-stopped
    # Un init mínimo como PID 1: reenvía las señales a node y recoge procesos
    # huérfanos. Sin él, node es el PID 1 y el kernel le trata las señales de
    # forma especial.
    init: true
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      pagos: { condition: service_healthy }
    # Los nombres de la capa de datos son variables para poder repartir el
    # sistema en dos computadores (RNF de desplegabilidad): por defecto son los
    # contenedores locales; `iniciar.sh --datos <IP>` los apunta a otra máquina.
    x-entorno: &entorno-comun
      NODE_ENV: development
      POSTGRES_HOST: ${HOST_POSTGRES:-postgres}
      POSTGRES_PUERTO: ${PUERTO_POSTGRES:-5432}
      REDIS_HOST: ${HOST_REDIS:-redis}
      REDIS_PUERTO: ${PUERTO_REDIS:-6379}
      RABBITMQ_URL: amqp://hexacore:hexacore@${HOST_RABBIT:-rabbitmq}:${PUERTO_RABBIT:-5672}
      AUTH_JWT_CLAVE_PUBLICA_ARCHIVO: /claves/jwt-publica.pem
      # Con qué se identifican los servicios entre sí en las rutas `/interno/`,
      # donde no hay usuario cuyo token reenviar — el trabajo de expiración de
      # Postventa (CU-006D). En desarrollo es un valor fijo y conocido; en
      # producción lo inyecta el orquestador y el servicio no arranca sin él.
      TOKEN_SERVICIOS: ${TOKEN_SERVICIOS:-hexacore-servicios-dev}
    # Solo aquí se monta también la privada: el módulo de Administración es el
    # único que firma tokens (ADR-11).
    environment:
      <<: *entorno-comun
      AUTH_JWT_CLAVE_PRIVADA_ARCHIVO: /claves/jwt-privada.pem
      PUERTO: "3002"
      PREFIJO_API: api/v1
      AUTH_JWT_EMISOR: hexacore-administracion
      POSTGRES_USUARIO: hexacore
      POSTGRES_CONTRASENA: hexacore
      # Una base por módulo: la separación de datos de ADR-01 que ADR-12
      # mantiene. Cada módulo abre su propia conexión contra la suya.
      POSTGRES_BD_ADMINISTRACION: administracion
      POSTGRES_BD_PEDIDOS: pedidos
      DB_HOST: ${HOST_POSTGRES:-postgres}
      DB_PORT: ${PUERTO_POSTGRES:-5432}
      DB_USER: hexacore
      DB_PASSWORD: hexacore
      DB_NAME: eventos_emergencias
      POSTGRES_MAX_CONEXIONES: "10"
      POSTGRES_ESPERA_MAXIMA_MS: "3000"
      CORREO_PROVEEDOR_URL: http://${HOST_CORREO:-correo}:${PUERTO_CORREO:-3098}
      PAGOS_URL: http://pagos:3008/api/v1
      PAGOS_TIMEOUT_MS: "12000"
    volumes:
      - ./claves-desarrollo/jwt-privada.pem:/claves/jwt-privada.pem:ro
      - ./claves-desarrollo/jwt-publica.pem:/claves/jwt-publica.pem:ro
    # En una máquina limpia, el primer arranque incluye inicializar PostgreSQL
    # y correr las migraciones. La sonda que trae la imagen agota sus
    # reintentos antes de eso y Compose da el sistema por fallido con todo ya
    # en pie; esta le da margen de sobra.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3002/api/v1/salud',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 10
    ports:
      - "3002:3002"

  # Boletería: cinco componentes existentes en un proceso, cuatro bases separadas.
  boleteria:
    profiles: ["servicios"]
    build:
      context: ../backend
      dockerfile: Dockerfile.boleteria
    restart: unless-stopped
    init: true
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      pagos: { condition: service_healthy }
    environment:
      <<: *entorno-comun
      PUERTO: "3001"
      POSTGRES_USUARIO: hexacore
      POSTGRES_CONTRASENA: hexacore
      POSTGRES_BD_VENTAS: entradas_mercado_secundario
      POSTGRES_BD_CATALOGO: catalogo
      POSTGRES_BD_POSTVENTA: postventa
      POSTGRES_BD_ACCESO_QR: acceso_qr
      PAGOS_URL: http://pagos:3008/api/v1
      COLA_AFORO_CONCURRENTE: "25"
    volumes:
      - ./claves-desarrollo/jwt-publica.pem:/claves/jwt-publica.pem:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/api/v1/salud',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 10
    ports: ["3001:3001"]

  # Microservicio de Pagos — el único que habla con la pasarela. Fase A de ADR-14.
  pagos:
    profiles: ["servicios"]
    build:
      context: ../backend
      dockerfile: Dockerfile.pagos
    # Sin `container_name`: ADR-14 le pone tres réplicas con autoescalado.
    restart: unless-stopped
    init: true
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      pasarela: { condition: service_healthy }
    environment:
      <<: *entorno-comun
      PUERTO: "3008"
      POSTGRES_BD_PAGOS: pagos
      PAGOS_PROVEEDOR_URL: http://${HOST_PASARELA:-pasarela}:${PUERTO_PASARELA:-3099}
      # El mismo que firma la pasarela. En producción es obligatorio y secreto.
      PASARELA_SECRETO_WEBHOOK: secreto-webhook-desarrollo
    volumes:
      - ./claves-desarrollo/jwt-publica.pem:/claves/jwt-publica.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3008/api/v1/salud',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 10
    # No se publica puerto al host: es un servicio interno, no lo llama ningún
    # cliente. Se alcanza por la red de compose desde Ventas, Postventa y
    # Alimentos, y la pasarela llega a su webhook a través del gateway.

  # Microservicio de Notificaciones — envío asíncrono de correos. Fase A de ADR-14.
  notificaciones:
    profiles: ["servicios"]
    build: ../services/notificaciones
    # Sin `container_name`: ADR-14 lo escala por longitud de cola.
    restart: unless-stopped
    init: true
    # Sin PostgreSQL: su estado es la cola. Necesita el broker, de donde toma
    # el trabajo, y el proveedor de correo, que es a quien se lo entrega.
    depends_on:
      rabbitmq: { condition: service_healthy }
      correo: { condition: service_healthy }
    environment:
      <<: *entorno-comun
      PUERTO: "3006"
      CORREO_PROVEEDOR_URL: http://${HOST_CORREO:-correo}:${PUERTO_CORREO:-3098}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3006/api/v1/salud',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    ports:
      - "3006:3006"

  # Portal Web de Clientes. Se sirve como sitio estático: el navegador de quien
  # lo abre es el que llama al gateway, así que la misma imagen vale en
  # cualquier máquina sin recompilar.
  portal-web-cliente:
    profiles: ["servicios"]
    build: ../frontend/portal-web-cliente
    container_name: hexacore-portal
    restart: unless-stopped
    depends_on:
      api-gateway: { condition: service_healthy }
    ports:
      - "4200:4200"

  # Portal Web Administrativo/Operativo. Se sirve como sitio estático igual que
  # el de clientes; el 4201 lo distingue del 4200 y el gateway ya acepta los dos
  # como origen de CORS.
  portal-web-admin:
    profiles: ["servicios"]
    build: ../frontend/portal-web-admin
    container_name: hexacore-portal-admin
    restart: unless-stopped
    depends_on:
      api-gateway: { condition: service_healthy }
    ports:
      - "4201:4201"

volumes:
  postgres-datos:
  redis-datos:
  rabbitmq-datos:
