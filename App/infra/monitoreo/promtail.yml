server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/posiciones.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

# Los logs de cada contenedor del proyecto, leídos del socket de Docker, con su
# servicio y su nombre como etiquetas.
scrape_configs:
  - job_name: contenedores
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Solo el sistema, no los proyectos de prueba e2e (ver prometheus.yml).
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        regex: hexacore-(infra|adr16)
        action: keep
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: servicio
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: contenedor
