# Se combina SOLO con ../docker-compose.yml mediante revision.sh.
# Ningún nombre, puerto, volumen, clave o imagen del entorno habitual se reutiliza.
x-etiquetas: &etiquetas
  hexacore.uso: ${REVISION_USO:-revision-arquitectura}
  hexacore.checkout: ${REVISION_CHECKOUT:?usar revision.sh}
x-sql: &sql
  NODE_ENV: development
  POSTGRES_HOST: postgres
  POSTGRES_PUERTO: "5432"
  POSTGRES_USUARIO: revision_demo
  POSTGRES_CONTRASENA: revision_demo_solo_local
  POSTGRES_BD: ${REVISION_BD:-hexacore_revision}
x-comun: &comun
  <<: *sql
  REDIS_HOST: redis
  REDIS_PUERTO: "6379"
  RABBITMQ_URL: amqp://revision_demo:revision_demo@rabbitmq:5672/revision
  AUTH_JWT_CLAVE_PUBLICA_ARCHIVO: /claves/jwt-publica.pem
  AUTH_JWT_EMISOR: hexacore-administracion
  TOKEN_SERVICIOS: revision-servicios-solo-demo
  PAGOS_PROVEEDOR_URL: http://pasarela:3099
  PASARELA_TIMEOUT_MS: "10000"
  POSTGRES_MAX_CONEXIONES: "10"
  POSTGRES_ESPERA_MAXIMA_MS: "3000"
x-compilacion: &compilacion
  labels:
    org.opencontainers.image.revision: ${REVISION_FUENTE:?usar revision.sh}
    hexacore.fuente.modificada: ${REVISION_MODIFICADA:?usar revision.sh}
    hexacore.checkout: ${REVISION_CHECKOUT:?usar revision.sh}

services:
  postgres:
    labels: *etiquetas
    container_name: !reset null
    environment: !override
      POSTGRES_USER: revision_demo
      POSTGRES_PASSWORD: revision_demo_solo_local
      POSTGRES_DB: ${REVISION_BD:-hexacore_revision}
    ports: !override ["127.0.0.1:${REVISION_PUERTO_15449:-15449}:5432"]
    volumes: !override ["postgres-datos:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revision_demo -d ${REVISION_BD:-hexacore_revision}"]
  redis:
    labels: *etiquetas
    container_name: !reset null
    ports: !override ["127.0.0.1:${REVISION_PUERTO_16394:-16394}:6379"]
  rabbitmq:
    labels: *etiquetas
    container_name: !reset null
    hostname: ${REVISION_USO:-revision-arquitectura}
    environment: !override
      RABBITMQ_DEFAULT_USER: revision_demo
      RABBITMQ_DEFAULT_PASS: revision_demo
      RABBITMQ_DEFAULT_VHOST: revision
    ports: !override ["127.0.0.1:${REVISION_PUERTO_15689:-15689}:5672", "127.0.0.1:${REVISION_PUERTO_16789:-16789}:15672"]
  pasarela:
    labels: *etiquetas
    container_name: !reset null
    image: ${REVISION_PROYECTO:-hexacore-${REVISION_USO:-revision-arquitectura}}-pasarela:local
    build: *compilacion
    environment: !override
      WEBHOOK_URL: http://api-gateway:8080/api/v1/pagos/webhook
      SECRETO_WEBHOOK: revision-webhook-solo-demo
    ports: !override ["127.0.0.1:${REVISION_PUERTO_13129:-13129}:3099"]
  correo:
    labels: *etiquetas
    container_name: !reset null
    image: ${REVISION_PROYECTO:-hexacore-${REVISION_USO:-revision-arquitectura}}-correo:local
    build: *compilacion
    ports: !override ["127.0.0.1:${REVISION_PUERTO_13128:-13128}:3098"]
  preparacion-base:
    labels: *etiquetas
    image: ${REVISION_PROYECTO:-hexacore-${REVISION_USO:-revision-arquitectura}}-nucleo:local
    build: !reset null
    environment: !override
      <<: *sql
  nucleo:
    labels: *etiquetas
    image: ${REVISION_PROYECTO:-hexacore-${REVISION_USO:-revision-arquitectura}}-nucleo:local
    build: *compilacion
    healthcheck:
      test: ["CMD", "sh", "/revision/sonda-salud.sh"]
    environment: !override
      <<: *comun
      PUERTO: "3002"
      PREFIJO_API: api/v1
      AUTH_JWT_CLAVE_PRIVADA_ARCHIVO: /claves/jwt-privada.pem
      CORREO_PROVEEDOR_URL: http://correo:3098
      PASARELA_SECRETO_WEBHOOK: revision-webhook-solo-demo
    volumes: !override
      - ${REVISION_ESTADO:-./revision/.estado}/jwt-privada.pem:/claves/jwt-privada.pem:ro
      - ${REVISION_ESTADO:-./revision/.estado}/jwt-publica.pem:/claves/jwt-publica.pem:ro
      - ../backend/modulos/personal-logistica/scripts/seed.mjs:/revision/seed-logistica.mjs:ro
      - ${REVISION_ESTADO:-./revision/.estado}/sonda-salud.sh:/revision/sonda-salud.sh:ro
    ports: !override ["127.0.0.1:${REVISION_PUERTO_13119:-13119}:3002"]
  boleteria:
    labels: *etiquetas
    image: ${REVISION_PROYECTO:-hexacore-${REVISION_USO:-revision-arquitectura}}-boleteria:local
    build: *compilacion
    healthcheck:
      test: ["CMD", "sh", "/revision/sonda-salud.sh"]
    environment: !override
      <<: *comun
      PUERTO: "3001"
      COLA_AFORO_CONCURRENTE: "25"
    volumes: !override
      - ${REVISION_ESTADO:-./revision/.estado}/jwt-publica.pem:/claves/jwt-publica.pem:ro
      - ${REVISION_ESTADO:-./revision/.estado}/sonda-salud.sh:/revision/sonda-salud.sh:ro
    ports: !override ["127.0.0.1:${REVISION_PUERTO_13127:-13127}:3001"]
  trabajador:
    labels: *etiquetas
    image: ${REVISION_PROYECTO:-hexacore-${REVISION_USO:-revision-arquitectura}}-trabajador:local
    build: *compilacion
    healthcheck:
      test: ["CMD", "sh", "/revision/sonda-salud.sh"]
    volumes:
      - ${REVISION_ESTADO:-./revision/.estado}/sonda-salud.sh:/revision/sonda-salud.sh:ro
    environment: !override
      NODE_ENV: development
      RABBITMQ_URL: amqp://revision_demo:revision_demo@rabbitmq:5672/revision
      PUERTO: "3006"
      CORREO_PROVEEDOR_URL: http://correo:3098
      CORREO_URL_BASE_ENLACES: ${REVISION_ENLACES:-http://revision.localhost:14210/cuenta}
    ports: !override ["127.0.0.1:${REVISION_PUERTO_13120:-13120}:3006"]
  api-gateway:
    labels: *etiquetas
    container_name: !reset null
    image: ${REVISION_PROYECTO:-hexacore-${REVISION_USO:-revision-arquitectura}}-gateway:local
    build: *compilacion
    volumes: !override
      - ../gateway/nginx-principal.conf:/etc/nginx/nginx.conf:ro
      - ${REVISION_ESTADO:-./revision/.estado}/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ../gateway/autenticar.conf:/etc/nginx/hexacore/autenticar.conf:ro
      - ../gateway/autenticacion.js:/etc/nginx/njs/autenticacion.js:ro
      - ${REVISION_ESTADO:-./revision/.estado}/jwt-publica.pem:/etc/nginx/claves/jwt-publica.pem:ro
    ports: !override ["127.0.0.1:${REVISION_PUERTO_18090:-18090}:8080"]
  portal-web-cliente:
    labels: *etiquetas
    container_name: !reset null
    image: ${REVISION_PROYECTO:-hexacore-${REVISION_USO:-revision-arquitectura}}-portal-cliente:local
    build: *compilacion
    volumes:
      - ${REVISION_ESTADO:-./revision/.estado}/configuracion.js:/usr/share/nginx/html/configuracion.js:ro
    ports: !override ["127.0.0.1:${REVISION_PUERTO_14210:-14210}:4200"]
  portal-web-admin:
    labels: *etiquetas
    container_name: !reset null
    image: ${REVISION_PROYECTO:-hexacore-${REVISION_USO:-revision-arquitectura}}-portal-admin:local
    build: *compilacion
    volumes:
      - ${REVISION_ESTADO:-./revision/.estado}/configuracion.js:/usr/share/nginx/html/configuracion.js:ro
    ports: !override ["127.0.0.1:${REVISION_PUERTO_14211:-14211}:4201"]

networks:
  default:
    name: ${REVISION_PROYECTO:-hexacore-${REVISION_USO:-revision-arquitectura}}-red
    labels: *etiquetas
volumes:
  postgres-datos:
    name: ${REVISION_PROYECTO:-hexacore-${REVISION_USO:-revision-arquitectura}}-postgres
    labels: *etiquetas
  redis-datos:
    name: ${REVISION_PROYECTO:-hexacore-${REVISION_USO:-revision-arquitectura}}-redis
    labels: *etiquetas
  rabbitmq-datos:
    name: ${REVISION_PROYECTO:-hexacore-${REVISION_USO:-revision-arquitectura}}-rabbitmq
    labels: *etiquetas
