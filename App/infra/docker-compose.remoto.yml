# Servicios en esta máquina con datos remotos. iniciar.sh exporta HOST_POSTGRES,
# HOST_REDIS, HOST_RABBIT, HOST_CORREO, HOST_PASARELA y sus puertos.
# Las cinco piezas de datos locales quedan fuera del perfil servicios.
# Se conservan Núcleo/Boletería -> Pagos y las dependencias de gateway/portales.
services:
  postgres:
    profiles: ["datos"]
  redis:
    profiles: ["datos"]
  rabbitmq:
    profiles: ["datos"]
  pasarela:
    profiles: ["datos"]
  correo:
    profiles: ["datos"]
  nucleo:
    depends_on: !override
      pagos: { condition: service_healthy }
  boleteria:
    depends_on: !override
      pagos: { condition: service_healthy }
  pagos:
    depends_on: !reset {}
  notificaciones:
    depends_on: !reset {}
