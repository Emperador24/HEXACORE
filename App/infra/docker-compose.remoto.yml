# Servicios en esta máquina con datos remotos. iniciar.sh exporta HOST_POSTGRES,
# HOST_REDIS, HOST_RABBIT, HOST_CORREO, HOST_PASARELA y sus puertos.
# Las cinco piezas de datos locales quedan fuera del perfil servicios.
# Se conservan Núcleo/Boletería -> preparación única de los ocho historiales y las dependencias de gateway/portales.
services:
  postgres:
    profiles: ["datos"]
  redis:
    profiles: ["datos"]
  rabbitmq:
    profiles: ["datos"]
  pasarela:
    profiles: ["datos"]
  correo:
    profiles: ["datos"]
  nucleo:
    depends_on: !override
      preparacion-base: { condition: service_completed_successfully }
  boleteria:
    depends_on: !override
      preparacion-base: { condition: service_completed_successfully }
  preparacion-base:
    depends_on: !reset {}
  trabajador:
    depends_on: !reset {}
