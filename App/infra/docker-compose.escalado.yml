# Quita puertos fijos para acceso por gateway. Boletería conserva su escalado.
# Núcleo reúne Identidad y Alimentos; no se certifica aquí la ejecución del
# sondeo de inventario entre réplicas. Mantener una réplica hasta comprobarla.
services:
  boleteria:
    ports: !reset []
  nucleo:
    ports: !reset []
