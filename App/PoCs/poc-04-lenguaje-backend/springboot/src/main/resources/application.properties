server.port=3002
logging.level.root=WARN

# Tomcat cierra la conexión cada 100 peticiones por defecto
# (maxKeepAliveRequests=100). Node/Express no tiene ese límite, así que dejarlo
# haría que el cliente reconecte constantemente contra Spring y no contra
# NestJS: la medición compararía políticas de keep-alive, no frameworks.
server.tomcat.max-keep-alive-requests=-1
