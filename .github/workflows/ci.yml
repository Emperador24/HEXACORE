# Integración continua de HEXACORE.
#
# Corre en cada pull request y en cada push a `main`: compila y prueba lo que
# hay, para que un cambio que rompe otra parte del sistema se vea en el PR y no
# el día de la entrega. Es lo mismo que hoy se hace a mano, escrito una vez.
#
# Los trabajos son independientes y corren en paralelo: si falla la app móvil,
# igual se sabe si los servicios están bien.
#
# El trabajo `integracion` levanta el sistema entero con el mismo `iniciar.sh`
# de la demostración y le lanza encima las suites de `pruebas/*.py` y las e2e
# de logística. Es lento comparado con los demás —construye seis imágenes—, así
# que va aparte: los trabajos rápidos siguen dando su veredicto en un par de
# minutos aunque este tarde diez.
#
# Lo que sigue sin estar: el e2e del portal y las de integración de la app
# móvil, que necesitan un navegador y un emulador.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Si se empuja dos veces seguidas a la misma rama, la primera ejecución se
# cancela: no tiene sentido esperar por un resultado ya obsoleto.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  FLUTTER_VERSION: '3.47.4'

jobs:
  # --------------------------------------------------------------------------
  # Nada de compilación entra al repositorio. Es rápido y va primero porque es
  # el error más fácil de cometer y el más molesto de deshacer después.
  # --------------------------------------------------------------------------
  artefactos:
    name: Sin artefactos de compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buscar archivos que no deberían estar versionados
        run: |
          encontrados=$(git ls-files \
            | grep -E '(^|/)(node_modules|build|dist|\.dart_tool|__pycache__|Pods)/|\.pyc$|(^|/)\.env$' \
            || true)
          if [ -n "$encontrados" ]; then
            echo "::error::Hay artefactos de compilación versionados:"
            echo "$encontrados"
            echo ""
            echo "Quítalos del índice sin borrarlos del disco:"
            echo "  git rm -r --cached <ruta>"
            exit 1
          fi
          echo "Limpio: ningún artefacto de compilación versionado."

  # --------------------------------------------------------------------------
  # Los microservicios con pruebas: compilan, pasan el chequeo de tipos y
  # corren sus pruebas.
  #
  # Redis va como servicio del trabajo porque las pruebas de inventario de
  # Pedidos (los scripts Lua de reserva) solo corren si se les da uno: sin
  # `REDIS_INVENTARIO_PRUEBAS_URL` se saltan solas —`describe.skip`— y 24
  # pruebas quedarían en verde sin haberse ejecutado. Los otros dos servicios
  # ignoran la variable.
  # --------------------------------------------------------------------------
  servicios:
    name: Servicio ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    strategy:
      # Si uno falla, los demás terminan igual: interesa ver todos los
      # resultados.
      fail-fast: false
      matrix:
        servicio: [administracion, entradas-mercado-secundario, pedidos]
    defaults:
      run:
        working-directory: App/services/${{ matrix.servicio }}
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_INVENTARIO_PRUEBAS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: App/services/${{ matrix.servicio }}/package-lock.json

      # `npm ci` y no `npm install`: instala exactamente lo del package-lock y
      # falla si los dos no coinciden, que es justo lo que se quiere en CI.
      - run: npm ci

      - name: Chequeo de tipos
        run: npm run lint

      - name: Pruebas unitarias
        run: npm test

      - name: Compilar
        run: npm run build

  # --------------------------------------------------------------------------
  # Servicio de Eventos/Emergencias (CU-018). Sus 20 pruebas son de integración
  # y necesitan PostgreSQL y RabbitMQ (`npm run test:e2e`), así que aquí solo se
  # compila y se pasa el lint. `npm test` corre y queda en verde aunque no haya
  # unitarias, para que el pipeline no dé rojo por una ausencia conocida.
  # --------------------------------------------------------------------------
  logistica:
    name: Servicio eventos-emergencias
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App/services/eventos-emergencias
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: App/services/eventos-emergencias/package-lock.json

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Pruebas unitarias
        run: npm test
      - name: Compilar
        run: npm run build

  # --------------------------------------------------------------------------
  # Pruebas de INTEGRACIÓN sobre el backend.
  #
  # La entrega pide cobertura de integración sobre el backend, y una prueba de
  # integración que solo corre en el portátil de quien la escribió no protege a
  # nadie: aquí es donde un cambio en Pedidos que rompe la reventa se ve en el
  # pull request.
  #
  # Se levanta con `./iniciar.sh`, **el mismo guion de la demostración**, y no
  # con `services:` de GitHub Actions. Dos razones: las suites hablan con la
  # pasarela y el correo simulados, que son contenedores del propio compose; y
  # así el guion de arranque queda probado en cada PR, que es el otro requisito
  # de desplegabilidad.
  # --------------------------------------------------------------------------
  integracion:
    name: Pruebas de integración del backend
    runs-on: ubuntu-latest
    # Diez minutos bastan de sobra; el tope evita que un servicio que no
    # arranca deje el trabajo colgado media hora.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Las suites son guiones de Python que hablan por HTTP; no necesitan
      # dependencias, solo el intérprete, que el runner ya trae.
      - name: Levantar el sistema completo
        working-directory: App/infra
        run: ./iniciar.sh

      - name: Servicio de Administración (CU-027)
        working-directory: App/services/administracion
        run: npm ci && npm run test:integracion

      - name: Servicio de Entradas y Mercado Secundario (CU-001 a CU-006)
        working-directory: App/services/entradas-mercado-secundario
        run: npm ci && npm run test:integracion

      - name: Servicio de Pedidos (CU-011)
        working-directory: App/services/pedidos
        run: npm ci && npm run test:integracion

      # Estas son e2e de Vitest contra su propia base, no guiones de Python.
      - name: Servicio de Eventos y Emergencias (CU-017, CU-018)
        working-directory: App/services/eventos-emergencias
        run: npm ci && npm run test:e2e

      # Sin esto, un fallo deja solo "exit 1" y hay que reproducirlo a ciegas.
      - name: Registros de los contenedores si algo falló
        if: failure()
        working-directory: App/infra
        run: docker compose -f docker-compose.yml --profile servicios logs --tail 100

      - name: Apagar
        if: always()
        working-directory: App/infra
        run: docker compose -f docker-compose.yml --profile servicios down -v

  # --------------------------------------------------------------------------
  # Los dos portales Angular: que compilen en modo producción.
  # --------------------------------------------------------------------------
  portales:
    name: Portal ${{ matrix.portal }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        portal: [portal-web-cliente, portal-web-admin]
    defaults:
      run:
        working-directory: App/frontend/${{ matrix.portal }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: App/frontend/${{ matrix.portal }}/package-lock.json

      - run: npm ci
      - name: Compilar
        run: npm run build

  # --------------------------------------------------------------------------
  # App móvil: análisis estático y pruebas de widget. No se compila el APK
  # aquí — tarda diez minutos y no añade información que el análisis no dé.
  # --------------------------------------------------------------------------
  app-movil:
    name: App móvil (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App/frontend/app-movil
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Análisis estático
        run: flutter analyze

      # Solo test/: integration_test/ habla con el backend real y necesita un
      # simulador, así que no cabe aquí.
      - name: Pruebas de widget
        run: flutter test test/

  # --------------------------------------------------------------------------
  # API Gateway (ADR-02): no tiene código, tiene configuración — y una coma
  # fuera de sitio en el nginx.conf tumba la entrada al backend entero. Nginx
  # la valida él mismo con `nginx -t`.
  # --------------------------------------------------------------------------
  gateway:
    name: Configuración del API Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar nginx.conf
        run: |
          docker run --rm \
            -v "$PWD/App/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

      - name: Validar docker-compose
        run: docker compose -f App/infra/docker-compose.yml --profile servicios config -q
