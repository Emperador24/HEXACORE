# Integración continua de HEXACORE.
#
# Corre en cada pull request y en cada push a `main`: compila y prueba lo que
# hay, para que un cambio que rompe otra parte del sistema se vea en el PR y no
# el día de la entrega. Es lo mismo que hoy se hace a mano, escrito una vez.
#
# Los trabajos son independientes y corren en paralelo: si falla la app móvil,
# igual se sabe si los servicios están bien.
#
# El trabajo `integracion` levanta el sistema entero con el mismo `iniciar.sh`
# de la demostración y le lanza encima las suites de `pruebas/*.py` y las e2e
# de logística. Es lento comparado con los demás —construye seis imágenes—, así
# que va aparte: los trabajos rápidos siguen dando su veredicto en un par de
# minutos aunque este tarde diez.
#
# Lo que sigue sin estar: el e2e del portal y las de integración de la app
# móvil, que necesitan un navegador y un emulador.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Si se empuja dos veces seguidas a la misma rama, la primera ejecución se
# cancela: no tiene sentido esperar por un resultado ya obsoleto.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PARALLEL_LIMIT: '1'
  NODE_VERSION: '22'
  FLUTTER_VERSION: '3.47.4'

jobs:
  # --------------------------------------------------------------------------
  # Nada de compilación entra al repositorio. Es rápido y va primero porque es
  # el error más fácil de cometer y el más molesto de deshacer después.
  # --------------------------------------------------------------------------
  artefactos:
    name: Sin artefactos de compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buscar archivos que no deberían estar versionados
        run: |
          encontrados=$(git ls-files \
            | grep -E '(^|/)(node_modules|build|dist|\.dart_tool|__pycache__|Pods)/|\.pyc$|(^|/)\.env$' \
            || true)
          if [ -n "$encontrados" ]; then
            echo "::error::Hay artefactos de compilación versionados:"
            echo "$encontrados"
            echo ""
            echo "Quítalos del índice sin borrarlos del disco:"
            echo "  git rm -r --cached <ruta>"
            exit 1
          fi
          echo "Limpio: ningún artefacto de compilación versionado."

  # --------------------------------------------------------------------------
  # Pruebas de INTEGRACIÓN sobre el backend.
  #
  # La entrega pide cobertura de integración sobre el backend, y una prueba de
  # integración que solo corre en el portátil de quien la escribió no protege a
  # nadie: aquí es donde un cambio en Pedidos que rompe la reventa se ve en el
  # pull request.
  #
  # Se levanta con `./iniciar.sh`, **el mismo guion de la demostración**, y no
  # con `services:` de GitHub Actions. Dos razones: las suites hablan con la
  # pasarela y el correo simulados, que son contenedores del propio compose; y
  # así el guion de arranque queda probado en cada PR, que es el otro requisito
  # de desplegabilidad.
  # --------------------------------------------------------------------------
  integracion:
    name: Pruebas de integración del backend
    runs-on: ubuntu-latest
    # Diez minutos bastan de sobra; el tope evita que un servicio que no
    # arranca deje el trabajo colgado media hora.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: App/backend/.nvmrc

      # Las suites son guiones de Python que hablan por HTTP; no necesitan
      # dependencias, solo el intérprete, que el runner ya trae.
      - name: Preparar herramientas de las semillas explícitas
        working-directory: App/backend
        run: npm ci && npm run build
      - name: Levantar instalación nueva con datos demo explícitos
        working-directory: App/infra
        run: ./iniciar.sh --datos-demo npm

      - name: Autenticación (CU-027)
        working-directory: App/backend
        run: npm ci && npm run test:http:identidad

      # Sin esto, un fallo deja solo "exit 1" y hay que reproducirlo a ciegas.
      - name: Registros de los contenedores si algo falló
        if: failure()
        working-directory: App/infra
        run: docker compose -f docker-compose.yml --profile servicios logs --tail 100

      - name: Apagar
        if: always()
        working-directory: App/infra
        run: docker compose -f docker-compose.yml --profile servicios down -v

  # --------------------------------------------------------------------------
  # Núcleo: CU-011, CU-017/CU-018 y convivencia en un proyecto exclusivo.
  # No usa iniciar.sh ni la infraestructura del job de integración general.
  # --------------------------------------------------------------------------
  nucleo:
    name: Backend (Núcleo, Boletería y Trabajador reales)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: App/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: App/backend/.nvmrc
          cache: npm
          cache-dependency-path: App/backend/package-lock.json
      - run: npm ci
      - name: Infraestructura exclusiva y preparación única de ocho esquemas
        run: npm run test:infra
      - name: Tipos
        run: npm run lint
      - name: Unitarias con Redis real
        id: unitarias
        env:
          REDIS_INVENTARIO_PRUEBAS_URL: redis://127.0.0.1:16384
          REDIS_HOST: 127.0.0.1
          REDIS_PUERTO: "16384"
        run: |
          mkdir -p .evidencia-e2e
          npm test -- --runInBand --json --outputFile=.evidencia-e2e/unitarias.json
      - name: Seguridad de resúmenes y manifiestos publicados
        run: node --test test/publicadas/seguridad-ci.test.cjs
      - name: Infraestructura de correo exclusiva
        run: npm run test:trabajador:infra
      - name: Contratos del correo y límites previos (RabbitMQ real)
        id: correo
        run: npm run test:trabajador
      - name: Identidad a RabbitMQ, Trabajador y proveedor simulado
        id: correo_identidad
        run: npm run test:trabajador:identidad
      - name: Composición real del módulo financiero sin HTTP
        run: npm run test:pagos:modulo
      - name: Integración del Núcleo dos veces
        id: nucleo
        run: |
          npm run test:e2e
          npm run test:e2e
      - name: Integración de Boletería dos veces, con Núcleo para los callbacks
        id: boleteria
        run: |
          npm run test:boleteria
          npm run test:boleteria
      - name: Configuración y fronteras
        run: npm run verificar:infra
      - name: Imagen del Trabajador
        run: npm run test:trabajador:imagen:infra
      - name: Salud, envío, pendientes y cierre de la imagen Trabajador
        run: npm run test:trabajador:imagen
      - name: Construir y arrancar ambas imágenes y gateway
        run: npm run test:imagen:infra
      - name: Smoke de Núcleo y Boletería
        id: imagenes
        run: |
          npm run test:imagen
          npm run test:boleteria:imagen
      - name: Contratos financieros y webhook, dos corridas
        id: pagos
        run: |
          npm run test:pagos:contratos
          npm run test:pagos:contratos
      - name: Libro común, convivencia y reinicio
        id: convivencia
        run: npm run test:pagos:convivencia
      - name: Logs si falla
        if: failure()
        run: |
          docker compose -p hexacore-base-unica-e2e -f test/docker-compose.e2e.yml -f test/docker-compose.imagen.yml logs --tail 100
          docker compose -p hexacore-trabajador-e2e -f test/trabajador/docker-compose.yml --profile imagen logs --tail 100
      - name: Resumen público sin datos del ensayo
        if: always()
        env:
          PASOS_JSON: >-
            {"unitarias":"${{ steps.unitarias.outcome }}","correo":"${{ steps.correo.outcome }}",
            "correo_identidad":"${{ steps.correo_identidad.outcome }}","nucleo":"${{ steps.nucleo.outcome }}",
            "boleteria":"${{ steps.boleteria.outcome }}","imagenes":"${{ steps.imagenes.outcome }}",
            "pagos":"${{ steps.pagos.outcome }}","convivencia":"${{ steps.convivencia.outcome }}"}
        run: python3 test/resumen-ci.py
      - name: Conservar solo el resumen permitido
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-resumen
          path: App/backend/.informe-ci/backend.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Limpiar solo el proyecto exclusivo
        if: always()
        run: |
          npm run test:trabajador:limpiar
          npm run test:limpiar

  # --------------------------------------------------------------------------
  # Los dos portales Angular: que compilen en modo producción.
  # --------------------------------------------------------------------------
  portales:
    name: Portal ${{ matrix.portal }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        portal: [portal-web-cliente, portal-web-admin]
    defaults:
      run:
        working-directory: App/frontend/${{ matrix.portal }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: App/frontend/${{ matrix.portal }}/package-lock.json

      - run: npm ci
      - name: Compilar
        run: npm run build

  # --------------------------------------------------------------------------
  # App móvil: análisis estático y pruebas de widget. No se compila el APK
  # aquí — tarda diez minutos y no añade información que el análisis no dé.
  # --------------------------------------------------------------------------
  app-movil:
    name: App móvil (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App/frontend/app-movil
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Análisis estático
        run: flutter analyze

      # Solo test/: integration_test/ habla con el backend real y necesita un
      # simulador, así que no cabe aquí.
      - name: Pruebas de widget
        run: flutter test test/

  # --------------------------------------------------------------------------
  # API Gateway (ADR-02, ADR-15): configuración de Nginx y un módulo njs que
  # valida el JWT — y una coma fuera de sitio tumba la entrada al backend
  # entero. Construir la imagen corre `nginx -t`, que valida la configuración
  # y además carga el njs: así se detecta también un error de sintaxis en
  # `autenticacion.js`.
  # --------------------------------------------------------------------------
  gateway:
    name: Configuración del API Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar nginx.conf y autenticacion.js
        run: docker build -t hexacore-gateway-ci App/gateway

      - name: Validar docker-compose
        run: docker compose -f App/infra/docker-compose.yml --profile servicios config -q

  datos:
    name: Transferencia histórica y aplicaciones sobre esquemas
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: App/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: App/backend/.nvmrc
          cache: npm
          cache-dependency-path: App/backend/package-lock.json
      - run: git fetch --no-tags origin be57961472a0802c90a57d247fb67e96e6717b1b
      - run: npm ci && npm run build
      - name: Fuente histórica fijada y destino del ensayo
        run: |
          npm run ensayo:datos:infra
          npm run ensayo:historico -- --levantar
      - name: Respaldar y conciliar ocho bases anteriores
        run: |
          npm run ensayo:datos -- preparar --salida=/tmp/hexacore-consolidacion/ci
          npm run ensayo:datos -- capturar --salida=/tmp/hexacore-consolidacion/ci
          ENSAYO_SALIDA=/tmp/hexacore-consolidacion/ci npm run ensayo:datos:verificar
          docker compose -p hexacore-backend-e2e -f test/consolidacion/historico/docker-compose.e2e.yml stop redis rabbitmq
      - name: Copia identificada, historiales reconocidos y lectura anterior a escrituras
        run: |
          npm run datos:clonar-pruebas -- /tmp/hexacore-consolidacion/ci
          npm run datos:preparar
        env:
          NODE_ENV: test
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PUERTO: '15439'
          POSTGRES_USUARIO: cu011_e2e
          POSTGRES_CONTRASENA: cu011_e2e
          POSTGRES_BD: hexacore_e2e
      - run: npm run datos:lectura-transferida
      - name: Aplicaciones sobre copia transferida
        run: |
          npm run test:imagen:infra
          npm run datos:verificar-preparacion
          npm run datos:flujos
          npm run datos:ejecucion
          npm run test:pagos:convivencia
          npm run test:limpiar
      - name: Instalación nueva aislada
        env:
          POSTGRES_BD_PRUEBAS: hexacore_vacia_e2e
        run: |
          npm run test:imagen:infra
          node test/base-unica/lectura-vacia.cjs
          python3 test/base-unica/comprobar-auxiliares.py
          npm run datos:verificar-preparacion
          npm run datos:flujos
          npm run datos:ejecucion
          npm run test:pagos:convivencia
          npm run test:limpiar
      - name: Parar proyectos propios sin borrar referencias/mensajes
        if: always()
        run: |
          npm run test:limpiar
          POSTGRES_BD_PRUEBAS=hexacore_vacia_e2e npm run test:limpiar
          docker compose -p hexacore-consolidacion-e2e -f test/consolidacion/docker-compose.yml stop
          docker compose -p hexacore-backend-e2e -f test/consolidacion/historico/docker-compose.e2e.yml -f test/consolidacion/historico/docker-compose.imagen.yml stop
      # No se publican respaldos, registros de filas, RDB ni manifiestos sensibles.
