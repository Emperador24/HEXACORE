# Entrega continua de HEXACORE.
#
# Cada vez que algo entra a `develop` o a `main`, este pipeline **construye las
# imágenes desplegables de esta etapa (incluido Núcleo y los simuladores) y las publica** en el
# registro de paquetes de GitHub (ghcr.io), etiquetadas con la rama y con el
# identificador exacto del commit.
#
# A partir de ahí, desplegar en cualquier computador es bajarse esas imágenes y
# levantarlas — sin compilar nada, sin Node instalado, sin el repositorio:
#
#   cd App/infra && ./iniciar.sh --registro develop
#
# ## Qué es y qué no es
#
# Es **entrega** continua: el artefacto queda construido, versionado y listo
# para desplegar, y el despliegue es una orden de un paso. No es **despliegue**
# continuo a un servidor de producción, porque este proyecto todavía no tiene
# uno; cuando lo tenga, se añade aquí un trabajo más que haga `docker compose
# pull && up -d` contra esa máquina.
#
# Decir esto con precisión importa más que aparentar más de lo que hay.
#
# ## Por qué ghcr.io y no Docker Hub
#
# Viene con el repositorio: no hace falta crear cuentas ni guardar contraseñas.
# El `GITHUB_TOKEN` que el propio pipeline recibe basta para publicar, y las
# imágenes heredan los permisos del repositorio.

name: CD

on:
  push:
    branches: [main, develop]
  # Permite publicar a mano desde la pestaña Actions, útil para preparar una
  # demostración sin tener que empujar un commit.
  workflow_dispatch:

env:
  REGISTRO: ghcr.io
  COMPOSE_PARALLEL_LIMIT: '1'
  # El único artifact permitido es el manifiesto público de digest/revisión.
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  compilacion:
    name: Compilar ${{ matrix.componente.nombre }} (${{ matrix.arquitectura }})
    runs-on: ${{ matrix.arquitectura == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arquitectura: [amd64, arm64]
        componente:
          - nombre: nucleo
            contexto: App/backend
          - nombre: boleteria
            contexto: App/backend
            dockerfile: App/backend/Dockerfile.boleteria
          - nombre: trabajador
            contexto: App/backend
            dockerfile: App/backend/Dockerfile.trabajador
          - nombre: pasarela
            contexto: App/infra/pasarela-pagos-simulada
          - nombre: correo
            contexto: App/infra/correo-simulado
          - nombre: gateway
            contexto: App/gateway
          - nombre: portal-cliente
            contexto: App/frontend/portal-web-cliente
          - nombre: portal-admin
            contexto: App/frontend/portal-web-admin
    steps:
      - uses: actions/checkout@v4
      - name: Exigir arquitectura nativa
        env:
          ESPERADA: ${{ matrix.arquitectura == 'arm64' && 'aarch64' || 'x86_64' }}
        run: test "$(uname -m)" = "$ESPERADA"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nombre de la imagen
        id: imagen
        run: echo "ruta=${REGISTRO}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/hexacore-${{ matrix.componente.nombre }}" >> "$GITHUB_OUTPUT"
      - name: Construir y publicar plataforma nativa
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.componente.contexto }}
          file: ${{ matrix.componente.dockerfile || format('{0}/Dockerfile', matrix.componente.contexto) }}
          push: true
          platforms: linux/${{ matrix.arquitectura }}
          # Etiqueta interna única por corrida; no modifica etiquetas de otras ramas.
          tags: ${{ steps.imagen.outputs.ruta }}:construccion-${{ github.sha }}-${{ github.run_id }}-${{ matrix.arquitectura }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.componente.nombre }}-${{ matrix.arquitectura }}
          cache-to: type=gha,mode=max,scope=${{ matrix.componente.nombre }}-${{ matrix.arquitectura }}

  imagenes:
    name: Manifest de ${{ matrix.nombre }}
    needs: compilacion
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        nombre: [nucleo, boleteria, trabajador, pasarela, correo, gateway, portal-cliente, portal-admin]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verificar plataformas y unir digests del mismo SHA
        env:
          RAMA: ${{ github.ref_name }}
        run: >-
          python3 App/backend/test/publicadas/unir-plataformas.py
          '${{ matrix.nombre }}' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$RAMA"
          '.informe-ci/${{ matrix.nombre }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: imagen-${{ matrix.nombre }}
          path: .informe-ci/${{ matrix.nombre }}.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  comprobacion:
    name: Digests publicados y arranque exclusivo
    needs: imagenes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: App/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: App/backend/.nvmrc
          cache: npm
          cache-dependency-path: App/backend/package-lock.json
      - run: npm ci && npm run build
      - uses: actions/download-artifact@v4
        with:
          pattern: imagen-*
          merge-multiple: true
          path: ${{ runner.temp }}/hexacore-imagenes
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preparación, gateway, finanzas, correo y cierre desde digests
        env:
          REVISION_PUBLICADA: ${{ github.sha }}
        run: node test/publicadas/comprobar.cjs "$RUNNER_TEMP/hexacore-imagenes"
      # Solo se suben los ocho JSON de nombre/revisión/digest. No .evidencia-e2e,
      # logs, dumps, RDB, tokens, correos ni manifiestos privados de datos.
