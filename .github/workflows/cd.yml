# Entrega continua de HEXACORE.
#
# Cada vez que algo entra a `develop` o a `main`, este pipeline **construye las
# imágenes desplegables de esta etapa (incluido Núcleo y los simuladores) y las publica** en el
# registro de paquetes de GitHub (ghcr.io), etiquetadas con la rama y con el
# identificador exacto del commit.
#
# A partir de ahí, desplegar en cualquier computador es bajarse esas imágenes y
# levantarlas — sin compilar nada, sin Node instalado, sin el repositorio:
#
#   cd App/infra && ./iniciar.sh --registro develop
#
# ## Qué es y qué no es
#
# Es **entrega** continua: el artefacto queda construido, versionado y listo
# para desplegar, y el despliegue es una orden de un paso. No es **despliegue**
# continuo a un servidor de producción, porque este proyecto todavía no tiene
# uno; cuando lo tenga, se añade aquí un trabajo más que haga `docker compose
# pull && up -d` contra esa máquina.
#
# Decir esto con precisión importa más que aparentar más de lo que hay.
#
# ## Por qué ghcr.io y no Docker Hub
#
# Viene con el repositorio: no hace falta crear cuentas ni guardar contraseñas.
# El `GITHUB_TOKEN` que el propio pipeline recibe basta para publicar, y las
# imágenes heredan los permisos del repositorio.

name: CD

on:
  push:
    branches: [main, develop]
  # Permite publicar a mano desde la pestaña Actions, útil para preparar una
  # demostración sin tener que empujar un commit.
  workflow_dispatch:

env:
  REGISTRO: ghcr.io
  COMPOSE_PARALLEL_LIMIT: '1'
  # El único artifact permitido es el manifiesto público de digest/revisión.
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  imagenes:
    name: Imagen de ${{ matrix.nombre }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Sin esto, el token no puede escribir en el registro de paquetes.
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Núcleo modular, backends aún separados, proveedores y portales.
          - nombre: nucleo
            contexto: App/backend
          - nombre: boleteria
            contexto: App/backend
            dockerfile: App/backend/Dockerfile.boleteria
          - nombre: trabajador
            contexto: App/backend
            dockerfile: App/backend/Dockerfile.trabajador
          - nombre: pasarela
            contexto: App/infra/pasarela-pagos-simulada
          - nombre: correo
            contexto: App/infra/correo-simulado
          - nombre: gateway
            contexto: App/gateway
          - nombre: portal-cliente
            contexto: App/frontend/portal-web-cliente
          - nombre: portal-admin
            contexto: App/frontend/portal-web-admin

    steps:
      - uses: actions/checkout@v4

      # Permite compilar para arm64 desde un runner amd64, por emulación.
      - name: Preparar QEMU
        uses: docker/setup-qemu-action@v3

      # Hace falta para guardar la caché de compilación entre corridas: el
      # driver que Docker trae por defecto en el runner no sabe exportarla.
      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar al registro
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Los nombres de imagen tienen que ir en minúsculas y el del repositorio
      # no lo está (Emperador24/HEXACORE).
      - name: Nombre de la imagen
        id: imagen
        run: echo "ruta=${REGISTRO}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/hexacore-${{ matrix.nombre }}" >> "$GITHUB_OUTPUT"

      - name: Etiquetas limitadas a la rama y revisión
        id: version
        env:
          RAMA: ${{ github.ref_name }}
        run: |
          if [ "$RAMA" = main ] || [ "$RAMA" = develop ]; then
            echo "etiqueta=$RAMA" >> "$GITHUB_OUTPUT"
          else
            echo "etiqueta=arquitectura-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - name: Metadatos de la revisión exacta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.imagen.outputs.ruta }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.etiqueta }}
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Construir y publicar
        id: publicar
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.contexto) }}
          push: true
          # Dos arquitecturas, y no es un lujo: los runners de GitHub son
          # amd64, pero los portátiles del equipo son Mac con chip Apple
          # (arm64). Publicando solo amd64, `./iniciar.sh --registro` falla en
          # la máquina de la demostración con «no matching manifest».
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # La caché de GitHub Actions evita recompilar `npm ci` en cada push.
          cache-from: type=gha,scope=${{ matrix.nombre }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nombre }}

      - name: Registrar digest sin datos privados
        env:
          NOMBRE: ${{ matrix.nombre }}
          IMAGEN: ${{ steps.imagen.outputs.ruta }}
          DIGEST: ${{ steps.publicar.outputs.digest }}
        run: |
          mkdir -p .informe-ci
          python3 - <<'PYDIGEST'
          import json,os,re
          from pathlib import Path
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', os.environ['DIGEST'])
          d={k.lower():os.environ[k] for k in ['NOMBRE','IMAGEN','DIGEST']}
          d['revision']=os.environ['GITHUB_SHA']
          Path('.informe-ci/'+d['nombre']+'.json').write_text(json.dumps(d)+'\n')
          PYDIGEST
      - uses: actions/upload-artifact@v4
        with:
          name: imagen-${{ matrix.nombre }}
          path: .informe-ci/${{ matrix.nombre }}.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  comprobacion:
    name: Digests publicados y arranque exclusivo
    needs: imagenes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: App/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: App/backend/.nvmrc
          cache: npm
          cache-dependency-path: App/backend/package-lock.json
      - run: npm ci && npm run build
      - uses: actions/download-artifact@v4
        with:
          pattern: imagen-*
          merge-multiple: true
          path: ${{ runner.temp }}/hexacore-imagenes
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preparación, gateway, finanzas, correo y cierre desde digests
        env:
          REVISION_PUBLICADA: ${{ github.sha }}
        run: node test/publicadas/comprobar.cjs "$RUNNER_TEMP/hexacore-imagenes"
      # Solo se suben los ocho JSON de nombre/revisión/digest. No .evidencia-e2e,
      # logs, dumps, RDB, tokens, correos ni manifiestos privados de datos.
